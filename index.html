<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Clarity Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --bg: #000000; --card: #1c1c1e; --accent: #007aff; --text: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        h1 { font-size: 28px; font-weight: 700; margin: 20px 0; color: var(--text); }
        .drop-zone { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; }
        .drop-zone:active { transform: scale(0.98); border-color: var(--accent); }
        textarea { width: 100%; height: 250px; margin: 20px 0; border-radius: 16px; border: none; padding: 16px; background: var(--card); color: var(--text); font-size: 15px; resize: none; display: none; }
        .meta-bar { display: flex; justify-content: space-between; font-size: 13px; color: #8e8e93; margin-bottom: 10px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        button { padding: 14px; border-radius: 12px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; background: #2c2c2e; color: white; }
        button.primary { background: var(--accent); }
        #status { font-size: 12px; color: #8e8e93; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Clarity Pro</h1>
    <div class="drop-zone" onclick="document.getElementById('input').click()">
        Tap to Select PDF
    </div>
    <input type="file" id="input" hidden accept="application/pdf">
    <div id="status">Ready for research</div>
    
    <div class="meta-bar" id="meta" style="display:none;">
        <span id="wordCount">Words: 0</span>
        <span id="pageCount">Pages: 0</span>
    </div>
    
    <textarea id="output" placeholder="Text will appear here..."></textarea>
    
    <div class="btn-group" id="actions" style="display: none;">
        <button onclick="clearText()">Clear</button>
        <button class="primary" onclick="refineText()">Refine</button>
        <button onclick="copyText()">Copy</button>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function processPDF(file) {
        document.getElementById('status').textContent = "Processing...";
        const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
        let fullText = "";
        
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            fullText += content.items.map(i => i.str).join(" ") + "\n";
        }

        document.getElementById('output').value = fullText;
        document.getElementById('output').style.display = "block";
        document.getElementById('actions').style.display = "grid";
        document.getElementById('meta').style.display = "flex";
        
        updateMeta(fullText, pdf.numPages);
        document.getElementById('status').textContent = "Ready.";
    }

    function updateMeta(text, pages) {
        const words = text.split(/\s+/).length;
        document.getElementById('wordCount').textContent = "Words: " + words.toLocaleString();
        document.getElementById('pageCount').textContent = "Pages: " + pages;
    }

    function refineText() {
        let text = document.getElementById('output').value;
        // Strip common copyright/legalese strings
        text = text.replace(/Copyright.*?(\d{4})/gi, "")
                   .replace(/All rights reserved/gi, "")
                   .replace(/\s+/g, ' ');
        document.getElementById('output').value = text;
        updateMeta(text, "Refined");
    }

    function clearText() { 
        document.getElementById('output').value = ''; 
        document.getElementById('meta').style.display = 'none';
        document.getElementById('actions').style.display = 'none';
    }
    
    function copyText() { 
        navigator.clipboard.writeText(document.getElementById('output').value); 
        alert("Text copied to clipboard!"); 
    }

    document.getElementById('input').onchange = (e) => processPDF(e.target.files[0]);
</script>
</body>
</html>
